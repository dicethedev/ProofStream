[workspace]
resolver = "2"
members = ["crates/proofstream-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dicethedev/proofstream"

[workspace.dependencies]
merkle-core = "0.4.1"
merkleforge-hash = "0.4.1"
merkle-variants = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
hex = "0.4.3"
