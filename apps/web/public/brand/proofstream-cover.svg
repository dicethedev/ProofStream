  <text x="800" y="224" text-anchor="middle" fill="#0A0A0D" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="700" letter-spacing="-5">Verify DEX activity</text>
  <text x="800" y="302" text-anchor="middle" fill="#0A0A0D" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="700" letter-spacing="-5">with proof receipts</text>
  <rect x="701" y="343" width="198" height="52" rx="26" fill="#050506"/>
  <text x="800" y="376" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Open proof lab</text>

  <rect x="530" y="464" width="540" height="292" rx="16" fill="#FFFFFF" stroke="#D3D4DE" stroke-width="2"/>
  <path d="M530 522H1070" stroke="#D3D4DE" stroke-width="2"/>
  <text x="552" y="500" fill="#34343D" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ProofStream</text>
  <text x="800" y="500" text-anchor="middle" fill="#5F5F6B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">02 / Seal</text>
  <circle cx="1018" cy="494" r="4" fill="#D8D8E2"/>
  <circle cx="1033" cy="494" r="4" fill="#4C4C58"/>
  <circle cx="1048" cy="494" r="4" fill="#D8D8E2"/>
